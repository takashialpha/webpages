name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Format check
        run: just fmt

  clippy:
    name: Clippy (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # The names `just lint` knows. What each one actually passes to clippy
      # lives in the justfile, so CI and a local run cannot disagree.
      matrix:
        target: [ssr, hydrate, guests]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: just lint ${{ matrix.target }}

  deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear, just

      - name: Unused dependencies
        run: just deps

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos, just

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The guests as well as the site, which is what a deploy ships.
      - name: Build
        run: just build
