name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasip1 is for the guest programs in bin/, which are separate
          # crates built for a different target than the site itself.
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos, just
      # Guests first, because they land in `public/`, which is what
      # cargo-leptos copies into the site. One recipe is the whole build.
      - run: just build
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/webpages dist/
          # Leptos resolves the hashed bundle names from this file, and looks
          # for it beside the binary. Without it the site serves unstyled.
          cp target/release/hash.txt dist/
          cp -r target/site dist/site
          # The unit and the deploy script travel with the release, so the
          # server can always fetch the pair that matches the binary.
          cp -r deploy dist/deploy
          tar -C dist -czf webpages-x86_64-linux.tar.gz webpages hash.txt site deploy
          sha256sum webpages-x86_64-linux.tar.gz > webpages-x86_64-linux.tar.gz.sha256
      - name: Drop previous rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete build --yes --cleanup-tag || true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build
          name: Latest build
          body: ${{ github.sha }}
          files: |
            webpages-x86_64-linux.tar.gz
            webpages-x86_64-linux.tar.gz.sha256
