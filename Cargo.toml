[workspace]
# The site, and the programs it serves. A glob, so adding a program is making
# its directory and nothing else.
members = [".", "bin/*"]
# A guest is a `wasm32-wasip1` binary and will not link for the host, so a
# plain `cargo build` must not try. Ask for one with `just guests`.
default-members = ["."]

# Every guest wants an unplanned pattern, not cryptography. Named once here so
# the version is in one place.
[workspace.dependencies]
fastrand = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/takashialpha/webpages"
# Resolved against the workspace root, so every member points at the one README.
readme = "README.md"

[package]
name = "webpages"
version = "0.0.0" # not versioned: there are no tags, and latest is whatever is in main
description = "My personal site, a tty in the browser, served live at takashialpha.com."
keywords = ["website", "leptos", "axum", "terminal"]
categories = ["web-programming"]
edition.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true

# Shared with the guests. They only deny `unsafe_code`; this crate forbids it
# at its roots, which is stricter and cannot be undone.
[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos renders through a global executor that only `leptos_axum`'s router
# helpers install, and this binary serves its one route by hand. Already in the
# tree via leptos, so naming it adds no crates.
any_spawner = { version = "0", features = ["tokio"], optional = true }
axum = { version = "0", features = ["http2"], optional = true }
console_error_panic_hook = { version = "0", optional = true }
# The board's rate limit. Hand-written windows and eviction are how you get a
# limiter that is subtly wrong. Default features add a faster clock, a
# concurrent map and a jitter source; `std` alone is plenty for one board.
governor = { version = "0", default-features = false, features = [
  "std",
], optional = true }
# `js_sys::WebAssembly` is how a guest is instantiated: the browser's own engine
# runs it, so no interpreter ships in the bundle. Already in the tree.
js-sys = { version = "0", optional = true }
leptos = { version = "0" }
leptos_axum = { version = "0", optional = true }
leptos_meta = { version = "0" }
# Where a URL stops in a line of prose is fiddlier than it looks. Same answer on
# the server and in the browser, which hydration needs.
linkify = { version = "0" }
# What the server binary uses directly: `fs` writes the board, `macros` is
# `#[tokio::main]` and `select!`, `net` is `TcpListener`, `signal` is the
# shutdown. Spelled out rather than inherited from axum's feature set, which is
# not ours to depend on.
tokio = { version = "1", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
], optional = true }
# `date` wants one format and no time zones: the calendar and the formatter,
# no parsing and no tzdb.
time = { version = "0", default-features = false, features = [
  "formatting",
  "macros",
  "std",
] }
tracing = { version = "0", optional = true }
# `ansi` implies `fmt`, which implies `registry` and `std`.
tracing-subscriber = { version = "0", default-features = false, features = [
  "ansi",
  "env-filter",
], optional = true }
wasm-bindgen = { version = "0", optional = true }
# Awaits `fetch` for the `wall` command. Leptos re-exports it, but only behind a
# `#[doc(hidden)]` path, so it is named here. Already in the tree.
wasm-bindgen-futures = { version = "0", optional = true }
# Only what leptos does not already switch on. `FontFaceSet` says when the
# console font has landed and the cell can be measured, `Performance` is how
# long the page has been open, `Selection` tells a ctrl-c copy from an
# interrupt, `VisualViewport` is the screen a phone keyboard leaves. See
# viewport.rs and clock.rs. Everything else, fetch and styles included, leptos
# enables already, and asking twice is a second place to keep in step.
web-sys = { version = "0", features = [
  "FontFaceSet",
  "Performance",
  "Selection",
  "VisualViewport",
], optional = true }

[features]
hydrate = [
  "leptos/hydrate",
  "dep:console_error_panic_hook",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
]
ssr = [
  "dep:any_spawner",
  "dep:axum",
  "dep:governor",
  "dep:tokio",
  "dep:leptos_axum",
  "dep:tracing",
  "dep:tracing-subscriber",
  "leptos/ssr",
  "leptos_meta/ssr",
]

# A tree this size emits enough DWARF to overflow the 4 GiB range of 32-bit
# debug relocations, which fails the link. Line tables still name the file and
# line in a backtrace, at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

# The bundle is fetched before the page can do anything, so it is built small.
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

# Where cargo-leptos puts what it builds, and what it builds it from. It erases
# `site-root` on every build, so nothing may be kept there.
[package.metadata.leptos]
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "[::1]:3000"
reload-port = 3001
browserquery = "defaults"

# Content-hash the bundle filenames, so a changed bundle gets a new URL and can
# be cached forever. Writes the hashes to `hash.txt` beside the server binary.
hash-files = true

# The site is two builds out of one crate: a server binary and a wasm bundle.
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

# Guests are fetched when they are run, so they are built small too. A profile
# only exists in the workspace root, which is why it is here rather than beside
# each of them.
[profile.guest]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
warnings = "deny"

# Denied, not forbidden, because a guest has to declare and call its wasm
# imports and both are unsafe. Each guest keeps that in one module and says
# why; the site forbids it outright at its crate roots.
unsafe_code = "deny"

# Security
non_ascii_idents = "forbid"

# Deny old style Rust
rust_2018_idioms = { level = "deny", priority = -1 }
macro_use_extern_crate = "deny"
absolute_paths_not_starting_with_crate = "deny"

# Easy to read style and opinionated best practices
unused_qualifications = "deny"
explicit_outlives_requirements = "warn"
single_use_lifetimes = "warn"

# General cleanliness and cleanup
unused_macro_rules = "warn"
unused_extern_crates = "deny"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Duplicate versions deep in someone else's tree, which we cannot do anything
# about.
multiple_crate_versions = "allow"

# All three are about leptos's `#[component]` macro. It expands a component
# into a trait impl with a same-named method; `view! {}` trees are long the way
# markup is long; and a `#[must_use]` on the source function does not reach the
# generated impl, so asking for one would be a no-op.
same_name_method = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"

# Picked out of `clippy::restriction` one at a time. Not the whole group: many
# of its lints contradict each other, or the choices above.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
mem_forget = "deny"
verbose_file_reads = "deny"
empty_drop = "deny"
float_cmp_const = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rest_pat_in_fully_bound_structs = "deny"
empty_structs_with_brackets = "deny"
format_push_string = "deny"
redundant_type_annotations = "deny"
semicolon_outside_block = "deny"
undocumented_unsafe_blocks = "deny"
unneeded_field_pattern = "deny"
mod_module_files = "deny"
unused_async = "deny"
