[workspace]
# The site, and the guest programs it serves. They are separate crates because
# they are separate programs, built for a different target.
# A glob, so adding a program is creating its directory and nothing else.
members = [".", "bin/*"]
# Only the site is built by an ordinary `cargo build` or `cargo clippy`. A
# guest is a `wasm32-wasip1` binary and does not link for the host, so building
# one has to be asked for: `make guests`, or `cargo build -p life --target
# wasm32-wasip1 --profile guest`.
default-members = ["."]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/takashialpha/webpages"
# Resolved against the workspace root, so every member points at the one
# README rather than carrying a copy of it.
readme = "README.md"

[package]
name = "webpages"
version = "0.0.0"                                                  # should not be versioned. tags/releases are not published; latest is always in main.
description = "My personal site, a tty in the browser, served live at takashialpha.com."
keywords = ["website", "leptos", "axum", "terminal"]
categories = ["web-programming"]
edition.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true

# The conventions every crate here is held to. `unsafe_code` is only denied by
# them; this crate forbids it outright at its roots, which is stricter.
[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0" }
# Leptos spawns onto a global executor that `leptos_axum` only installs from
# its own router helpers, which this binary does not use. Already in the tree
# via leptos, so declaring it adds no crates.
any_spawner = { version = "0", features = ["tokio"], optional = true }
axum = { version = "0", features = ["http2"], optional = true }
console_error_panic_hook = { version = "0", optional = true }
# `js_sys::WebAssembly` is how a guest program is instantiated: the browser's
# own engine runs it, so no interpreter ships in the bundle. Already in the tree
# via wasm-bindgen, so declaring it adds no crates.
js-sys = { version = "0", optional = true }
leptos_axum = { version = "0", optional = true }
leptos_meta = { version = "0" }
# Each feature backs something the server binary uses directly: `fs` for
# persisting the graffiti board, `macros` for `#[tokio::main]` and `select!`,
# `net` for `TcpListener`, `signal` for graceful shutdown. Spelled out rather than left to feature unification from axum, whose
# own feature set is not ours to depend on.
tokio = { version = "1", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
], optional = true }
tracing = { version = "0", optional = true }
# `ansi` implies `fmt`, which implies `registry` and `std`.
tracing-subscriber = { version = "0", default-features = false, features = [
  "ansi",
  "env-filter",
], optional = true }
wasm-bindgen = { version = "0", optional = true }
# Awaits the browser's `fetch` for the `wall` command. Leptos re-exports this,
# but only behind a `#[doc(hidden)]` path that is not its public surface, so it
# is declared here instead. Already in the tree via leptos, so no new crates.
wasm-bindgen-futures = { version = "0", optional = true }
# The web-sys features leptos does not already switch on for us. `Performance`
# measures how long the page has been open, see clock.rs; `VisualViewport`
# measures the part of the screen a phone keyboard leaves visible, see
# viewport.rs, `CssStyleDeclaration` is how that reaches the stylesheet, and the
# request types are what the `wall` command talks to the server with.
web-sys = { version = "0", features = [
  "CssStyleDeclaration",
  "Performance",
  "Request",
  "RequestInit",
  "Response",
  "Selection",
  "VisualViewport",
], optional = true }

[features]
hydrate = [
  "leptos/hydrate",
  "dep:console_error_panic_hook",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
]
ssr = [
  "dep:any_spawner",
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "dep:tracing",
  "dep:tracing-subscriber",
  "leptos/ssr",
  "leptos_meta/ssr",
]

# A tree this size emits enough DWARF to overflow the 4 GiB range of 32-bit debug
# relocations, which fails the link. Line tables still give file and line in
# backtraces, at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
# output-name = "webpages"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/webpages.css
style-file = "style/main.css"
# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# Content-hash the bundle filenames, so a changed bundle gets a new URL and can
# be cached forever. Writes the hashes to `hash.txt` next to the server binary.
hash-files = true

# The IP and port (ex: [::1]:3000) where the server serves the content. Use it in your server setup.
site-addr = "[::1]:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"


# Guests are fetched over the wire when they are run, so they are built small.
# A profile only exists in the workspace root, which is why it is here rather
# than beside each of them.
[profile.guest]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
warnings = "deny"

# Denied rather than forbidden, because it cannot be forbidden everywhere: a
# guest program has to declare and call its wasm imports, and both are unsafe.
# The site adds `#![forbid(unsafe_code)]` at its crate roots, which is stricter
# and cannot be undone; a guest confines unsafe to one module and says why.
unsafe_code = "deny"

# Security
non_ascii_idents = "forbid"

# Deny old style Rust
rust_2018_idioms = { level = "deny", priority = -1 }
macro_use_extern_crate = "deny"
absolute_paths_not_starting_with_crate = "deny"

# Easy to read style and opinionated best practices
unused_qualifications = "deny"
explicit_outlives_requirements = "warn"
single_use_lifetimes = "warn"

# General cleanliness and cleanup
unused_macro_rules = "warn"
unused_extern_crates = "deny"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Not actionable in this repo: flags duplicate transitive dependency versions
# pulled in via our dependency tree.
multiple_crate_versions = "allow"

# Leptos's `#[component]` macro expands each page/component fn into a trait
# impl with a same-named method, and `view! {}` trees are naturally long
# JSX-like markup, neither reflects an actual code smell here. The macro
# also doesn't propagate a `#[must_use]` placed on the source fn through to
# the generated impl, so that attribute is a silent no-op on components too.
same_name_method = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"

# Selected `clippy::restriction` lints (not enabled as a group: many of its
# lints actively conflict with each other or with pedantic/nursery choices
# above).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
mem_forget = "deny"
verbose_file_reads = "deny"
empty_drop = "deny"
float_cmp_const = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rest_pat_in_fully_bound_structs = "deny"
empty_structs_with_brackets = "deny"
format_push_string = "deny"
redundant_type_annotations = "deny"
semicolon_outside_block = "deny"
undocumented_unsafe_blocks = "deny"
unneeded_field_pattern = "deny"
mod_module_files = "deny"
unused_async = "deny"
